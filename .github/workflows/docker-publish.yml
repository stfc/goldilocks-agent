name: Build and publish Docker image

# Publishes two images of the same source, each its own package under
# ghcr.io/<owner>/ (stfc, or a fork's own owner):
# - goldilocks-agent-local, the local version: one person on their own
#   machine (the repository's docker-compose.yml);
# - goldilocks-agent-web, the web version: the shared deployment at
#   workbench.goldilocks.ac.uk (deploy/stfc-cloud/docker-compose.yml). It
#   differs in the frontend, which a build-time Vite flag switches
#   (`npm run build:stfc-cloud`).
# Only `main` and version tags publish; other branches and PRs only run the
# `test` gate below.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Same checks as `uv run poe check`/`poe web-check` (AGENTS.md's local
  # pre-PR gate) -- a broken build must never reach `latest`. Runs on every
  # PR too, not just pushes to main, so problems surface before merge.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run poe lint
      # Integration tests (real Claude/Ollama/goldilocks-core/janus-core
      # calls) each have their own `skipif` on the credential/service they
      # need (see AGENTS.md's testing philosophy) -- none of those are
      # configured on this runner, so they skip cleanly rather than fail.
      - run: uv run poe test
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm run lint
      # `vite build` only transpiles; this is the frontend's only type gate.
      - working-directory: app
        run: npm run typecheck
      - working-directory: app
        run: npm run test
      - working-directory: app
        run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    # One publish per branch at a time, in push order: several merges in a
    # row used to publish side by side, and whichever finished last owned
    # `latest`, an older commit as often as not (2026-11-11: web `latest`
    # was #126's build after #128 had merged). A newer push waits for the
    # running publish and replaces any older one still waiting.
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: false
    # Only main/tags actually publish -- PRs stop at the `test` job above,
    # they never get push permission or a registry login.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    # What each package page says above the repository README: plain text,
    # 512 characters at most.
    env:
      LOCAL_DESCRIPTION: >-
        Goldilocks on your own computer: a chat assistant that sets up DFT
        calculations with goldilocks-core. To run it, download
        docker-compose.yml from https://github.com/stfc/goldilocks-agent, run
        "docker compose up -d" and open http://localhost:8080. The README
        below has the steps. Keeps your chat history, has every Tool and uses
        your own model keys.
      WEB_DESCRIPTION: >-
        The server image behind https://workbench.goldilocks.ac.uk, the
        Goldilocks website. You don't need it: to use Goldilocks, open the
        website; to run it on your own computer, use
        ghcr.io/stfc/goldilocks-agent-local (steps in the README below).
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both images: `latest` on every push to main, plus the short commit
      # sha (`sha-xxxxxxx`) to pin one build; the local version also gets
      # semver tags (`v1.2.3` -> `1.2.3`/`1.2`/`1`) on a version tag push.
      # Each image's description is set as a label and as manifest and index
      # annotations: GitHub's package page reads a multi-arch image's from
      # the index (DOCKER_METADATA_ANNOTATIONS_LEVELS).
      - id: meta-local
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # Derived from the running repo, not hardcoded: a fork runs this
          # same workflow with its own GITHUB_TOKEN, scoped to its own
          # ghcr.io/<owner>/* namespace, where a hardcoded owner would just
          # fail to push.
          images: ghcr.io/${{ github.repository }}-local
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=goldilocks-agent-local
            org.opencontainers.image.description=${{ env.LOCAL_DESCRIPTION }}
          annotations: |
            org.opencontainers.image.title=goldilocks-agent-local
            org.opencontainers.image.description=${{ env.LOCAL_DESCRIPTION }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-local.outputs.tags }}
          labels: ${{ steps.meta-local.outputs.labels }}
          annotations: ${{ steps.meta-local.outputs.annotations }}
          # No build provenance attestation: GHCR lists it under OS / Arch as
          # an "unknown/unknown" platform with its own pull command, which
          # reads as a third image. Nothing checks it.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # amd64 only, the STFC VM's architecture; its own cache scope, so the
      # two builds don't evict each other's layers.
      - id: meta-web
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=goldilocks-agent-web
            org.opencontainers.image.description=${{ env.WEB_DESCRIPTION }}
          annotations: |
            org.opencontainers.image.title=goldilocks-agent-web
            org.opencontainers.image.description=${{ env.WEB_DESCRIPTION }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: FRONTEND_BUILD_SCRIPT=build:stfc-cloud
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          annotations: ${{ steps.meta-web.outputs.annotations }}
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
