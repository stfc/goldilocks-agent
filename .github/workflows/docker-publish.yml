name: Build and publish Docker image

# Publishes ghcr.io/<owner>/goldilocks-agent (whichever repo this runs in --
# stfc/goldilocks-agent, or a fork under its own owner) so `docker compose pull` (or a plain `docker pull`) gives a
# colleague a working image with no local clone/build/toolchain needed --
# only `main` and version tags publish; other branches/PRs only run the
# `test` gate below.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Same checks as `uv run poe check`/`poe web-check` (AGENTS.md's local
  # pre-PR gate) -- a broken build must never reach `latest`. Runs on every
  # PR too, not just pushes to main, so problems surface before merge.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run poe lint
      # Integration tests (real Claude/Ollama/goldilocks-core/janus-core
      # calls) each have their own `skipif` on the credential/service they
      # need (see AGENTS.md's testing philosophy) -- none of those are
      # configured on this runner, so they skip cleanly rather than fail.
      - run: uv run poe test
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm run lint
      - working-directory: app
        run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    # Only main/tags actually publish -- PRs stop at the `test` job above,
    # they never get push permission or a registry login.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `latest` on every push to main, plus the short commit sha for
      # traceability; semver tags (`v1.2.3` -> `1.2.3`/`1.2`/`1`) on a
      # version tag push, for whenever real releases start.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Derived from the running repo, not hardcoded: a fork runs this
          # same workflow with its own GITHUB_TOKEN, scoped to its own
          # ghcr.io/<owner>/* namespace, where a hardcoded owner would just
          # fail to push.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
