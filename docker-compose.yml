services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # One-shot: waits for `ollama` to answer, pulls the model the chat
  # engine expects (graph.py's LOCAL_MODEL), then exits. Re-running is a
  # cheap no-op once the model is already pulled.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c"]
    command:
      - >
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull qwen3.8
    restart: "no"

  agent:
    # Published by .github/workflows/docker-publish.yml on every push to
    # main -- `docker compose up` pulls this if it can, so a colleague only
    # needs this one file, not a clone of the source tree. `build: .` stays
    # as a fallback/dev override: `docker compose up --build` (or `poe`/
    # local dev work) still builds from source and tags the result the same
    # way, and if the registry is ever unreachable, `up` falls back to it.
    image: ghcr.io/junwen94/goldilocks-agent:latest
    pull_policy: always
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_API_BASE: http://ollama:11434
      # Optional -- uncomment/set to enable the matching feature:
      # ANTHROPIC_API_KEY:
      # OPENAI_API_KEY:
      # GEMINI_API_KEY:
      # MP_API_KEY:
      GOLDILOCKS_AGENT_MLIP_ENABLED: "1"
      # This image bakes in goldilocks-core's own *source* (Dockerfile,
      # /opt/goldilocks-core, pinned to a real release tag) as the default
      # DFT Workbench backend -- checkout mode, not the PyPI/uvx autostart
      # path, since that's the only mode the magnetism ML tier below can
      # ever use (no addressable, persistent venv to install its fork
      # into). Its own deps (torch et al.) are still a lazy, first-open-of-
      # the-Tool download into the goldilocks_core_venv volume below, same
      # shape as MLIP Playground's own mlip_cli_venv.
      GOLDILOCKS_CORE_PATH: /opt/goldilocks-core
      # DFT Workbench's magnetism ML tier (mMACE: real ML is_magnetic
      # classification + magnetic-ordering ranking, not the heuristic/LLM
      # fallback) -- on by default in this image for the same reason MLIP
      # Playground is above: this compose file's job is the full local
      # experience, not the minimal one. First real DFT Workbench open
      # additionally downloads a checkpoint plus a handful of manually-
      # pinned packages goldilocks-ml has no PyPI extra for (see
      # core_server.py's `_spawn_command()` and README.md's Configuration
      # section for the same recipe run by hand) -- several GB, one-time,
      # cached in the same goldilocks_core_venv volume.
      GOLDILOCKS_AGENT_MMACE_ENABLED: "1"
      # Developing goldilocks-core itself instead of using the baked-in
      # checkout above? Point at your own -- this overrides the default
      # (not "opts into checkout mode": that's already the default now) --
      # mount it and uncomment both lines to match:
      # GOLDILOCKS_CORE_PATH: /goldilocks-core   # see docs/getting-started.md
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - goldilocks_home:/home/goldilocks
      - mlip_cli_venv:/app/mlip-cli/.venv
      - goldilocks_core_venv:/opt/goldilocks-core/.venv
      # - /path/to/your/goldilocks-core:/goldilocks-core
    restart: unless-stopped

volumes:
  ollama_data:
  goldilocks_home:
  mlip_cli_venv:
  goldilocks_core_venv:
