services:
  agent:
    # Published by .github/workflows/docker-publish.yml on every push to
    # main -- `docker compose up` pulls this if it can, so a colleague only
    # needs this one file, not a clone of the source tree. `build: .` stays
    # as a fallback/dev override: `docker compose up --build` (or `poe`/
    # local dev work) still builds from source and tags the result the same
    # way, and if the registry is ever unreachable, `up` falls back to it.
    # Defaults to the canonical stfc/goldilocks-agent image (public, pulls
    # anonymously). A fork's CI publishes under its own owner, so owner/tag
    # stay env-overridable -- via a sibling `.env` file or inline:
    # `GOLDILOCKS_AGENT_IMAGE_OWNER=<fork-owner> GOLDILOCKS_AGENT_IMAGE_TAG=sha-xxxxxxx docker compose up -d`.
    image: ghcr.io/${GOLDILOCKS_AGENT_IMAGE_OWNER:-stfc}/goldilocks-agent:${GOLDILOCKS_AGENT_IMAGE_TAG:-latest}
    pull_policy: always
    build: .
    # `host.docker.internal`: reaches Ollama running *natively* on your own
    # machine, not a containerized one -- 2026-09-25, removed the
    # `ollama`/`ollama-pull` services here after confirming live that
    # Docker Desktop for Mac gives containers no GPU/Metal passthrough,
    # forcing qwen3.8 (27B) onto pure CPU inference inside a container
    # (measured: a single chat reply took ~3 minutes, eventually timing out
    # mid-stream) -- night-and-day slower than the same model running
    # natively with Metal acceleration. Docker Desktop resolves this
    # hostname to the host out of the box; Linux Docker needs the
    # `extra_hosts` entry below (harmless no-op on Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_API_BASE: http://host.docker.internal:11434
      # Optional -- uncomment/set to enable the matching feature:
      # ANTHROPIC_API_KEY:
      # OPENAI_API_KEY:
      # GEMINI_API_KEY:
      # MP_API_KEY:
      GOLDILOCKS_AGENT_MLIP_ENABLED: "1"
      # DFT Workbench's backend is goldilocks-core from PyPI, the release in
      # core_pin.json: `uvx` installs it on the Tool's first open, into uv's
      # cache in goldilocks_home, with its models and pseudopotentials
      # (mMACE's backbone included).
      GOLDILOCKS_AGENT_CORE_AUTOSTART: "1"
      # CPU torch for core: PyPI's own Linux torch is a CUDA build, a few GB
      # bigger and much slower on the CPU (deploy/stfc-cloud/docker-compose.yml).
      UV_TORCH_BACKEND: cpu
      # Developing goldilocks-core itself? Run your own checkout instead
      # (checkout mode): mount it and uncomment both lines to match. Its
      # environment then lives in the checkout's own .venv.
      # GOLDILOCKS_CORE_PATH: /goldilocks-core   # see docs/getting-started.md
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - goldilocks_home:/home/goldilocks
      - mlip_cli_venv:/app/mlip-cli/.venv
      # - /path/to/your/goldilocks-core:/goldilocks-core
    restart: unless-stopped

volumes:
  goldilocks_home:
  mlip_cli_venv:
