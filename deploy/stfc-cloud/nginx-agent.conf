# Hand this to whoever administers goldilocks.stfc.ac.uk's shared nginx --
# it is NOT a standalone site config. `/` (portal) and `/workbench`
# (goldilocks-core/web) are served by other repos' own content under the
# same domain (design doc §19.3); this is only the `/agent/` piece.
#
# Usage: `include /path/to/nginx-agent.conf;` inside that shared nginx's
# `server { ... }` block (the one already terminating TLS for the whole
# domain -- TLS/certbot is a domain-wide concern, not this repo's, see
# README.md in this directory).
#
# ⚠️ Replace <STFC_INTRANET_CIDR> below with the real range from STFC IT
# before this goes live -- design doc §19.4: this `allow`/`deny` pair is
# the *only* access-control layer for /agent/ (OpenStack's Security Group
# can only filter by port, not by path, since only one floating IP was
# granted for the whole domain).
location /agent/ {
    allow <STFC_INTRANET_CIDR>;
    deny all;

    # No prefix stripping -- matches app/.env.stfc-cloud's `VITE_BASE_PATH=/agent/`
    # build, which already emits `/agent/`-prefixed asset URLs itself.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Required for /agent/api/chat's SSE streaming to work through the proxy
    # at all -- learned the hard way in v1 (old-goldilcoks-webapp's own
    # nginx.conf carries the same two lines for the same reason). Without
    # `proxy_buffering off`, nginx buffers the whole response before
    # forwarding it, which defeats streaming entirely; the default
    # `proxy_read_timeout` is far too short for a long chat turn.
    proxy_buffering off;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
}
