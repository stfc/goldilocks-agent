# STFC Cloud shared deployment (design doc §19) -- distinct from the
# repo-root docker-compose.yml, which is the single-local-user build.
#
# Scope of this file: the agent app itself + Ollama (serving qwen3.8:27b
# on this VM's own GPU), nothing else. It does NOT run nginx or handle TLS
# -- this deployment is one path
# segment (`/agent/`) under a domain shared with two other repos' own
# content (`/` the portal, `/workbench` goldilocks-core/web), so the actual
# internet-facing nginx + certbot setup is a domain-wide concern owned by
# whoever administers that shared entry point, not this repo (v1's own STFC
# deployment used exactly this split -- see old-goldilcoks-webapp's
# docs/stfc-deployment.md: the backend only ever bound to 127.0.0.1, system
# nginx for the whole domain lived in goldilocks-web's own deploy folder).
# See nginx-agent.conf in this directory for the snippet to hand to
# whoever owns that config, and README.md for the full bring-up sequence.
services:
  agent:
    build:
      context: ../..
      args:
        # This VM is reached directly at its own address (see the `ports`
        # comment below), not via a shared domain's /agent/ subpath -- so
        # the frontend must be built with root-relative asset paths, not
        # /agent/-prefixed ones. Switch to `build:stfc-cloud-public` (see
        # app/.env.stfc-cloud-public) once this sits behind the shared-domain
        # nginx instead (design doc §19.3).
        FRONTEND_BUILD_SCRIPT: build:stfc-cloud-internal
    image: goldilocks-agent-stfc-cloud:latest
    environment:
      GOLDILOCKS_AGENT_SHARED_DEPLOYMENT: "1"
      # Chat backend: Ollama, served by the `ollama` service below on this
      # same VM's GPU -- see graph.py's resolve_model(). Pinned explicitly
      # to `:27b` rather than relying on LOCAL_MODEL's hardcoded `:latest`
      # default, since that tag hasn't been confirmed to resolve to the
      # same size.
      GOLDILOCKS_AGENT_MODEL: ollama_chat/qwen3.8:27b
      OLLAMA_API_BASE: http://ollama:11434
      # Design doc §19.7: the real safe number needs measuring on this VM
      # under real load, not guessing -- leave unset (no limit) until that
      # measurement happens, then set it here.
      # GOLDILOCKS_AGENT_CHAT_CONCURRENCY_LIMIT: ""
      # Optional -- uncomment/set to enable the matching feature:
      # ANTHROPIC_API_KEY:
      # OPENAI_API_KEY:
      # GEMINI_API_KEY:
      # MP_API_KEY:
      # MLIP Playground is offered by the local version only (2026-11-09,
      # mlip_playground_offered() in src/goldilocks_agent/tools/__init__.py):
      # with GOLDILOCKS_AGENT_SHARED_DEPLOYMENT set, its routes 404 and the
      # chat model never sees its tools, whatever this opt-in says. Keep it
      # (and both mlip_cli_venv lines below) commented out here.
      # GOLDILOCKS_AGENT_MLIP_ENABLED: "1"
      GOLDILOCKS_CORE_PATH: /opt/goldilocks-core
    ports:
      # Direct STFC-internal access (2026-09-29, same pattern as
      # goldilocks-core-DFTworkbench-stable's :8000) -- interim mode while
      # the shared-domain nginx/TLS setup (design doc §19.4/§19.8) is still
      # blocked on the pending STFC floating-IP/subdomain allocation.
      # Reachable from anyone on the STFC internal network/VPN once the
      # OpenStack Security Group and this VM's own ufw both allow 8080/tcp
      # (see README.md). Revert to "127.0.0.1:8080:8080" once nginx/TLS is
      # ready and path-based access control at /agent/ takes over instead.
      - "8080:8080"
    volumes:
      - goldilocks_home:/home/goldilocks
      # - mlip_cli_venv:/app/mlip-cli/.venv   # MLIP Playground, see above
      - goldilocks_core_venv:/opt/goldilocks-core/.venv
    depends_on:
      - ollama
    restart: unless-stopped
    # Container-wide memory backstop (stfc/goldilocks-agent#70): goldilocks-core's
    # mMACE worker grows with the structure (~45 MB/atom, 11.8 GB at 250 atoms,
    # 2026-11-09). At the limit the kernel kills the largest process in THIS
    # container -- that worker -- instead of a host-wide OOM kill hitting Ollama.
    # See README.md "Memory limit".
    mem_limit: 32g
    memswap_limit: 32g

  # Serves qwen3.8:27b on this VM's own GPU (requires nvidia-container-toolkit
  # configured as the Docker runtime on the host -- see README.md). Not
  # exposed outside the compose network; the `agent` service reaches it at
  # OLLAMA_API_BASE above.
  ollama:
    image: ollama/ollama:latest
    environment:
      # Default OLLAMA_KEEP_ALIVE (5m) unloads the model from VRAM after
      # every idle gap that long -- on a low-traffic shared instance, that
      # means most first messages pay a full reload (measured: a few
      # seconds once warm vs. 10-55s to reload, see design doc §19.7).
      # 80GB card has ~46GB free with this one model loaded, no reason to
      # ever unload it.
      OLLAMA_KEEP_ALIVE: "-1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # One-shot: waits for `ollama` to answer, pulls the model the chat engine
  # expects (pinned to :27b, see the agent service's GOLDILOCKS_AGENT_MODEL
  # comment above), then exits. Re-running is a cheap no-op once the model
  # is already pulled.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c"]
    command:
      - >
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull qwen3.8:27b
    restart: "no"

  # Side-by-side vLLM trial for stfc/goldilocks-agent#68 (phase 3): serves the
  # same chat model as `ollama` for a load test while Ollama keeps serving
  # production. Behind the `vllm` profile, so a plain `docker compose up -d`
  # never starts it. The agent doesn't use it until the cutover (phase 5:
  # GOLDILOCKS_AGENT_MODEL=hosted_vllm/qwen3.8-27b, VLLM_API_BASE). See
  # README.md "vLLM side by side".
  vllm:
    image: vllm/vllm-openai:v0.32.0
    profiles: ["vllm"]
    depends_on:
      vllm-download:
        condition: service_completed_successfully
    entrypoint: ["vllm", "serve"]
    command:
      # INT4 (W4A16, Marlin kernels on the A100) with the vision tower left
      # unquantized: the same 4-bit class as Ollama's Q4_K_M, and ~19.5 GB, so
      # it fits beside Ollama. The FP8 checkpoint (~31 GB) would leave ~5 GB
      # of the budget below for the KV cache.
      - RedHatAI/Qwen3.8-27B-INT4
      # Contains "qwen3.8", so resolve_model() gives it qwen's sampling.
      - --served-model-name=qwen3.8-27b
      # Ollama holds ~36 GB of the 80 GB card (2026-11-09); 0.45 is ~37 GB.
      - --gpu-memory-utilization=0.45
      # Longest prompt seen in production: 19.9k tokens.
      - --max-model-len=32768
      - --enable-prefix-caching
      # From vLLM's Qwen3.8-27B recipe.
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=qwen3
      # Thinking off for every request, matching #76 on Ollama (vLLM ignores
      # Ollama's `think`; Qwen3.8's chat template reads `enable_thinking`).
      - '--default-chat-template-kwargs={"enable_thinking": false}'
    environment:
      HF_HUB_OFFLINE: "1"  # weights come from `vllm-download`
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      # VM loopback only: for the load test, and an SSH tunnel for the eval.
      - "127.0.0.1:8001:8000"
    restart: "no"

  # One-shot: downloads the vLLM weights into `hf_cache`. Host networking,
  # because this VM's 1450 MTU against the compose bridge's 1500 resets long
  # downloads (the same problem as the Dockerfile's git clone, README.md).
  vllm-download:
    image: vllm/vllm-openai:v0.32.0
    profiles: ["vllm"]
    network_mode: host
    entrypoint: ["python3", "-c"]
    command:
      - from huggingface_hub import snapshot_download; snapshot_download("RedHatAI/Qwen3.8-27B-INT4")
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: "no"

volumes:
  goldilocks_home:
  # mlip_cli_venv:   # MLIP Playground, see the agent service's environment
  goldilocks_core_venv:
  ollama_data:
  hf_cache:
