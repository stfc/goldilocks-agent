# GoAccess config for the public goldilocks.ac.uk box. Install to
# /etc/goaccess/goaccess.conf -- see README.md in this directory.
#
# Option names here are the config-file form of the CLI flags (goaccess
# man page: the long-form flag name, no leading dashes, space-separated
# value).

# nginx's default access log format is Combined. If the site's own
# `access_log` directive sets a custom format, this must match it or
# goaccess parses nothing and reports zero visitors.
log-format COMBINED

# One log per site, so agent and workbench traffic stay separable -- see
# README.md step 1. Multiple log-file lines are merged into one report;
# split them into two configs + two outputs if you want separate numbers.
log-file /var/log/nginx/agent.access.log

# Rotated logs are the reason for the on-disk DB: logrotate truncates
# access.log weekly, so a stateless run would only ever report the current
# week. `restore` loads what was parsed before, `persist` writes the new
# state back -- together they make each run incremental.
persist true
restore true
db-path /var/lib/goaccess

output /var/www/goaccess/agent.html

# Bots are most of the traffic on any public address and are not visitors.
ignore-crawlers true
unknowns-as-crawlers true

# Drops the last IPv4 octet before anything is stored, so the on-disk DB
# never holds a full client IP. Keeps unique-visitor counts working
# (hashed per day) without retaining personal data -- the whole reason
# this is server-log analytics instead of Google Analytics.
anonymize-ip true

# Note on reading the report: the Requests panel will be dominated by
# `/api/chat` and friends -- those are the frontend's own XHR/SSE calls,
# not page views. Visitor and hit counts are unaffected by this; just
# don't read "top request" as "top page".

# Real OS names rather than the raw UA string.
real-os true
