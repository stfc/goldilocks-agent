# Serves the generated report at /stats/, password-protected. Include this
# inside the TLS `server {}` block certbot already manages
# (/etc/nginx/sites-enabled/workbench).
#
# Without the auth_basic pair this publishes your traffic data, referrers
# and (anonymized) visitor breakdown to anyone who guesses the path --
# the report is a static HTML file with no access control of its own.
location /stats/ {
    alias /var/www/goaccess/;
    autoindex on;

    auth_basic "Goldilocks stats";
    auth_basic_user_file /etc/nginx/.htpasswd-stats;
}
