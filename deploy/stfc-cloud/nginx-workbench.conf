# Per-client-IP limits for the expensive endpoints
limit_req_zone $binary_remote_addr zone=chat:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=compute:10m rate=6r/m;
limit_req_status 429;

server {
    server_name workbench.goldilocks.ac.uk host-130-246-214-189.nubes.stfc.ac.uk;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/chat {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /api/mlip/ {
        limit_req zone=compute burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 600s;
    }

    location = /run {
        limit_req zone=compute burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/workbench.goldilocks.ac.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/workbench.goldilocks.ac.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = host-130-246-214-189.nubes.stfc.ac.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = workbench.goldilocks.ac.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name workbench.goldilocks.ac.uk host-130-246-214-189.nubes.stfc.ac.uk;
    return 404; # managed by Certbot




}